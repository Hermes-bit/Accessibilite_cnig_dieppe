name: Deploy mviewer → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mviewer/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cloner mviewer (core)
        run: |
          git clone --depth 1 --branch master https://github.com/mviewer/mviewer.git _site
          rm -rf _site/.git _site/.github _site/demo _site/docs

      - name: Injecter les fichiers CNIG
        run: |
          mkdir -p _site/apps
          cp -r mviewer/apps/. _site/apps/
          cp mviewer/config/cnig_accessibilite.xml _site/apps/cnig_accessibilite.xml
          sed -i 's|url="/api/v1/|url="https://hermes58.alwaysdata.net/api/v1/|g' \
            _site/apps/cnig_accessibilite.xml
          sed -i 's|var API_BASE = "/auth"|var API_BASE = "https://hermes58.alwaysdata.net/auth"|g' \
            _site/apps/userauth/userauth.js
          sed -i 's|"/api/v1/|"https://hermes58.alwaysdata.net/api/v1/|g; s|`/api/v1/|`https://hermes58.alwaysdata.net/api/v1/|g' \
            _site/apps/dbexplorer/dbexplorer.js
          sed -i 's|"/api/v1/|"https://hermes58.alwaysdata.net/api/v1/|g; s|`/api/v1/|`https://hermes58.alwaysdata.net/api/v1/|g' \
            _site/apps/routing/routing.js
          sed -i 's|var API_BASE = "/api/v1"|var API_BASE = "https://hermes58.alwaysdata.net/api/v1"|g' \
            _site/apps/feedback/feedback.js
          ls -la _site/apps/cnig_accessibilite.xml

      - name: Déployer sur GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch _site/.nojekyll
          rm -f _site/.gitignore
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy mviewer"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages
