name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hermes58_a4_test
          POSTGRES_USER: hermes58
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        working-directory: backend
        run: flake8 app/

      - name: Format check (black)
        working-directory: backend
        run: black --check app/

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret
          TEST_DATABASE_URL: postgresql://hermes58:testpassword@localhost:5432/hermes58_a4_test
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --target production -t cnig-backend:ci ./backend

      - name: Build nginx image
        run: docker build -t cnig-nginx:ci ./nginx
